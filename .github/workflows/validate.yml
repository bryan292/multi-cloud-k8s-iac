name: Validate multi-cloud infrastructure
on:
  workflow_call:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Build pinned tooling (checksums verified)
        run: docker build -t aws-iac-tools .
      - name: Validate modules and mocked plans without cloud credentials
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$GITHUB_WORKSPACE:/app" aws-iac-tools scripts/validate.sh
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Scan IaC and secrets
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          version: v0.76.2
          scan-type: fs
          scanners: misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true
      - name: Generate dependency SBOM
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          version: v0.76.2
          scan-type: fs
          format: cyclonedx
          output: sbom.cdx.json
          scanners: vuln
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: sbom.cdx.json
          retention-days: 14
