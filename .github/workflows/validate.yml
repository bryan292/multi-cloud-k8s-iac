name: Validate multi-cloud infrastructure
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned tooling (checksums verified)
        run: docker build -t aws-iac-tools .
      - name: Validate modules and mocked plans without cloud credentials
        run: docker run --rm -v "$GITHUB_WORKSPACE:/app" aws-iac-tools scripts/validate.sh
