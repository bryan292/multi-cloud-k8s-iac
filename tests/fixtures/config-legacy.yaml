global:
  provider: aws
  kubernetes_version: '1.35'
  cluster_name: demo
  environment: dev
  common_tags:
    Environment: dev
    Project: multi-cloud-k8s-iac
    ManagedBy: Terraform
aws:
  account_id: '123456789012'
  profile: my-aws-profile
  bucket_name: replace-with-a-globally-unique-state-bucket
  region: us-east-1
  state_region: us-east-1
azure:
  subscription_id: 00000000-0000-0000-0000-000000000000
  tenant_id: 00000000-0000-0000-0000-000000000000
  location: eastus
  resource_group_name: dev-demo-aks
  state:
    resource_group_name: multi-cloud-k8s-iac-tfstate
    storage_account_name: tfstateexample123
    container_name: tfstate
  network:
    vnet_cidr: 10.70.0.0/16
    subnet_cidr: 10.70.0.0/20
    api_server_authorized_ip_ranges: []
  node_pool:
    vm_size: Standard_D2s_v3
    zones:
    - '1'
    - '2'
    min: 2
    desired: 2
    max: 4
network:
  vpc_cidr: 10.0.0.0/16
  az_count: 3
  single_nat_gateway: false
  domain: example.com
  hosted_zone_id: REPLACE_WITH_EXISTING_PUBLIC_ZONE
eks:
  admin_cidrs: []
  admin_principal_arns:
  - arn:aws:iam::123456789012:role/DeploymentRole
  node_instance_types:
  - m6i.large
  - m6a.large
  - m5.large
  node_capacity_type: ON_DEMAND
  node_scaling:
    min: 2
    desired: 2
    max: 6
  addon_versions: {}
umbrella:
  metrics_server: true
  aws_load_balancer_controller: true
  cert_manager: true
  external_dns: true
  cluster_autoscaler: true
  monitoring: true
  loki: false
platform:
  repository: https://github.com/example/helm-umbrella-charts.git
  commit: 0123456789abcdef0123456789abcdef01234567
  secret_name: ''
  path: ''
  acme_email: admin@example.com
application:
  enabled: false
  repository: ''
  commit: ''
  path: ./
  secret_name: ''
